<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="styleeee.css">
    <link rel="stylesheet" href="form validation.js">
  <title>REGISTRATION FORM</title>
 
</head>
<body>
  <div class="form-container">
    <h1>REGISTRATION FORM</h1>
    <form method="post" name="form1" onsubmit="return validate()">
      <label for="name">Name:</label>
      <input type="text" name="name" placeholder="Enter your full name">

      <label for="address">Address:</label>
      <input type="text" name="address" placeholder="Enter your address">

      <label for="email">E-mail Address:</label>
      <input type="email" name="email" placeholder="Enter your email">

      <label for="password">Password:</label>
      <input type="password" name="password" id="password" placeholder="Enter password">

      <label for="password">Confirm password</label>
      <input type="password" name="Confirm password" id="confirm" placeholder="Enter password">

      <label for="course">Select Your Country:</label>
      <select name="course" id="select">
        <option value="">--Select--</option>
        <option value="Course1">RWANDA</option>
        <option value="Course2">UGANDA</option>
        <option value="Course3">KENYA</option>
        <option value="Course4">TANZANIA</option>
      </select>

      <label for="college">College Name:</label>
      <textarea cols="20" rows="3" name="college" placeholder="Enter college name"></textarea>

      <input type="checkbox" name="check" id="check">
      <label for="check" class="checkbox-label">I agree to the above information</label><br><br>

      <button type="submit">Send</button>
      <button type="reset">Reset</button>
    </form>
  </div>
</body>
</html>
